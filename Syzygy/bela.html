<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BE辣！！！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e6e6e6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(30, 30, 46, 0.8);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        .be-title {
            font-size: 3rem;
            color: #ff6b6b;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
            letter-spacing: 3px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #a5b1c2;
            margin-bottom: 40px;
        }
        
        .stats-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 40px 0;
        }
        
        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
            flex: 1;
            min-width: 150px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-box:hover {
            transform: translateY(-5px);
        }
        
        .stat-value {
            font-size: 2.5rem;
            color: #4ecdc4;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 1rem;
            color: #a5b1c2;
        }
        
        .ending-message {
            font-size: 1.3rem;
            line-height: 1.8;
            margin: 40px 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border-left: 4px solid #ff6b6b;
        }
        
        .thank-you {
            font-size: 1.8rem;
            color: #4ecdc4;
            margin: 60px 0 30px;
            opacity: 0;
            animation: fadeIn 2s ease 1s forwards;
            line-height: 1.6;
        }
        
        .signature {
            font-size: 1.5rem;
            color: #a5b1c2;
            margin-top: 10px;
            font-style: italic;
            opacity: 0;
            animation: fadeIn 2s ease 2s forwards;
        }
        
        .hidden-text {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
            transition: all 0.5s ease;
            cursor: pointer;
            user-select: none;
            z-index: 10;
            padding: 5px 10px;
            border-radius: 3px;
        }
        
        .hidden-text:hover {
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .hidden-text.active {
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
        }
        
        .return-btn {
            position: fixed;
            bottom: 60px;
            left: 20px;
            background: linear-gradient(135deg, #4ecdc4 0%, #6ae6dd 100%);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(78, 205, 196, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .return-btn.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .return-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(78, 205, 196, 0.6);
        }
        
        .author-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .author-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6);
        }
        
        .author-btn:active {
            transform: translateY(1px);
        }
        
        .decoration {
            position: absolute;
            opacity: 0.1;
            z-index: 0;
        }
        
        .decoration-1 {
            top: 10%;
            left: 10%;
            font-size: 5rem;
            color: #ff6b6b;
        }
        
        .decoration-2 {
            bottom: 20%;
            right: 10%;
            font-size: 4rem;
            color: #4ecdc4;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 手机和平板兼容性优化 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .be-title {
                font-size: 2.2rem;
            }
            
            .stats-container {
                flex-direction: column;
            }
            
            .author-btn {
                bottom: 20px;
                right: 20px;
                padding: 12px 20px;
                font-size: 1rem;
            }
            
            .hidden-text {
                bottom: 15px;
                left: 15px;
                font-size: 0.7rem;
            }
            
            .return-btn {
                bottom: 50px;
                left: 15px;
                padding: 8px 16px;
                font-size: 0.8rem;
            }
            
            .thank-you {
                font-size: 1.5rem;
            }
            
            .signature {
                font-size: 1.3rem;
            }
        }
        
        @media (max-width: 480px) {
            .be-title {
                font-size: 1.8rem;
            }
            
            .thank-you {
                font-size: 1.3rem;
                margin: 40px 0 20px;
            }
            
            .signature {
                font-size: 1.1rem;
            }
            
            .author-btn {
                padding: 10px 18px;
                font-size: 0.9rem;
            }
        }
        
        /* 平板横屏优化 */
        @media (min-width: 769px) and (max-width: 1024px) and (orientation: landscape) {
            .container {
                max-width: 90%;
                padding: 30px;
            }
        }
        
        /* 防止在移动设备上文字过小 */
        @media (max-width: 320px) {
            .hidden-text {
                font-size: 0.65rem;
            }
            
            .return-btn {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="decoration decoration-1">❌</div>
    <div class="decoration decoration-2">💔</div>
    
    <div class="container">
        <h1 class="be-title">BAD ENDING</h1>
        <p class="subtitle">灰常遗憾...故事在此终结...</p>
        
        <div class="thank-you" onclick="window.open('/', '_blank')">
            感谢游玩，你的反馈是我最大的动力
        </div>
        <div class="signature">
            ———AQI
        </div>
    </div>
    
    <div class="hidden-text">骗你哒，返回重试叭~</div>
    <button class="return-btn" onclick="window.location.href='./forum.html'">返回重试</button>
    
    <button class="author-btn" onclick="window.location.href='#'">作者嘟碎碎念</button>

    <script>
        // 添加一些交互效果
        document.addEventListener('DOMContentLoaded', function() {
            const hiddenText = document.querySelector('.hidden-text');
            const returnBtn = document.querySelector('.return-btn');
            let clickCount = 0;
            
            // 点击隐藏文字时的效果
            hiddenText.addEventListener('click', function() {
                clickCount++;
                
                if (clickCount === 1) {
                    // 第一次点击
                    this.classList.add('active');
                    this.textContent = '真的可以返回重试哦~';
                    
                    // 显示返回按钮
                    setTimeout(() => {
                        returnBtn.classList.add('show');
                    }, 300);
                    
                } else if (clickCount === 2) {
                    // 第二次点击直接跳转
                    window.location.href = './computer-lin.html';
                }
            });
            
            // 触摸设备优化
            hiddenText.addEventListener('touchstart', function(e) {
                e.preventDefault();
                this.style.transform = 'scale(0.95)';
            });
            
            hiddenText.addEventListener('touchend', function(e) {
                e.preventDefault();
                this.style.transform = 'scale(1)';
            });
            
            // 移动端按钮触摸反馈
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                button.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.95)';
                });
                
                button.addEventListener('touchend', function() {
                    this.style.transform = 'scale(1)';
                });
            });
            
            // 防止移动端双击缩放
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
        });
    </script>
</body>

</html>
