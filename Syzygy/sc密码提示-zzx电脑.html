<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="../gallery/search.png">
    <title>周哲叙电脑提示 - 搜索结果</title>
    <!-- ch-->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            padding-top: 30px;
        }

        .logo {
            display: block;
            margin: 0 auto 20px;
            width: 150px;
            height: 150px;
        }

        .search-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .search-box {
            width: 500px;
            padding: 12px 20px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
        }

            .search-box:focus {
                box-shadow: 0 1px 6px rgba(32, 33, 36, 0.45);
            }

        .search-button {
            background-color: #4285f4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .news-list {
            list-style-type: none;
            padding-left: 0;
        }

        .news-item {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

            .news-item .title {
                font-size: 18px;
                font-weight: bold;
                color: #1a0dab;
                text-decoration: none;
            }

                .news-item .title:hover {
                    text-decoration: underline;
                }

            .news-item .source {
                font-size: 14px;
                color: #6a6a6a;
            }

            .news-item .date {
                font-size: 12px;
                color: #777;
            }

        .related-searches {
            margin-top: 40px;
        }

            .related-searches h2 {
                font-size: 24px;
                margin-bottom: 10px;
            }

            .related-searches ul {
                list-style-type: none;
                padding-left: 0;
            }

                .related-searches ul li {
                    font-size: 16px;
                    margin-bottom: 5px;
                }

                    .related-searches ul li a {
                        color: #1a0dab;
                        text-decoration: none;
                    }

                        .related-searches ul li a:hover {
                            text-decoration: underline;
                        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="../gallery/search.png" alt="Logo" class="logo">
        <div class="search-container">
            <input type="text" class="search-box" id="searchInput" placeholder="搜索其他关键词..." value="周哲叙电脑提示">
            <button class="search-button" id="searchButton">搜索</button>
        </div>
        <h1 id="pageTitle">周哲叙电脑提示 - 搜索结果列表</h1>
        <div id="loadingIndicator" class="loading" style="display: none;">加载中...</div>
        <ul class="news-list" id="resultsList">
            <!-- 搜索结果将在这里动态生成 -->
        </ul>

        <div class="related-searches">
            <h2>猜你想搜</h2>
            <ul id="relatedSearchesList">
                <!-- 固定显示三个关键词 -->

                <li><a href="javascript:void(0)" class="related-search" data-keyword="周哲叙电脑怎么连接？">周哲叙电脑怎么连接？</a></li>

            </ul>
        </div>
    </div>

    <script>
        // 全局变量来存储关键词映射
        let keywordRedirects = {};

        // 从JSON文件加载关键词映射
        async function loadKeywordRedirects() {
            try {
                console.log('开始加载关键词映射...');
                document.getElementById('loadingIndicator').style.display = 'block';

                // 修正为正确的JSON文件URL（包含.json扩展名）
                const url = './meizhaoledejson2.json?v=' + Date.now();
                const response = await fetch(url);

                if (!response.ok) {
                    console.warn('关键词映射文件加载失败，状态码:', response.status);
                    document.getElementById('loadingIndicator').style.display = 'none';
                    return;
                }

                const data = await response.json();
                console.log('✅ 关键词映射加载成功:', Object.keys(data).length, '个关键词');

                // 适配不同的JSON格式：直接URL格式或数组格式
                Object.keys(data).forEach(key => {
                    try {
                        const value = data[key];

                        // 如果值是字符串（直接URL格式），则转换为数组格式
                        if (typeof value === 'string') {
                            keywordRedirects[key] = value;
                            console.log(`   "${key}" -> ${value} (直接URL格式)`);
                        }
                        // 如果值是数组（原格式），则取第一个元素的URL
                        else if (Array.isArray(value) && value.length > 0) {
                            const redirectInfo = value[0];
                            const redirectUrl = redirectInfo.url || redirectInfo;
                            keywordRedirects[key] = redirectUrl;
                            console.log(`   "${key}" -> ${redirectUrl} (数组格式)`);
                        }
                    } catch (e) {
                        console.warn('处理关键词失败:', key, e);
                    }
                });

                console.log('总共加载了', Object.keys(keywordRedirects).length, '个关键词');
                document.getElementById('loadingIndicator').style.display = 'none';

            } catch (error) {
                console.error('❌ 加载关键词映射失败:', error);
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }

        // 检查关键词映射 - 直接匹配
        function checkKeywordRedirect(query) {
            if (!keywordRedirects || Object.keys(keywordRedirects).length === 0) {
                console.log('⚠️ 关键词映射未加载');
                return false;
            }

            console.log(`🔎 搜索检查: "${query}"`);

            // 直接检查关键词映射
            if (keywordRedirects[query]) {
                const redirectUrl = keywordRedirects[query];
                console.log('🎯 找到匹配! 跳转到:', redirectUrl);
                window.location.href = redirectUrl; // 使用window.location.href进行跳转
                return true;
            }

            console.log('❌ 未找到关键词映射');
            return false;
        }

        // 执行普通搜索功能
        function performNormalSearch(query) {
            console.log('🔍 执行普通搜索:', query);

            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';

            document.title = `${query} - 搜索结果`;
            const pageTitle = document.getElementById('pageTitle');
            if (pageTitle) {
                pageTitle.textContent = `${query} - 搜索结果列表`;
            }

            const results = searchResults[query] || [];

            if (results.length === 0) {
                const noResultsItem = document.createElement('li');
                noResultsItem.className = 'news-item';
                noResultsItem.innerHTML = `
                                <div class="title">搜索: ${query}</div>
                                <div class="source">暂无搜索结果，请尝试其他关键词</div>
                            `;
                resultsList.appendChild(noResultsItem);
            } else {
                results.forEach(result => {
                    const resultItem = document.createElement('li');
                    resultItem.className = 'news-item';
                    resultItem.innerHTML = `
                                    <a href="${result.url}" class="title" target="_blank">${result.title}</a>
                                    <div class="source">${result.source}</div>
                                    <div class="date">${result.date}</div>
                                `;
                    resultsList.appendChild(resultItem);
                });
            }
        }

        // 主搜索函数
        function performSearch(query) {
            console.log('🚀 开始搜索:', query);

            if (checkKeywordRedirect(query)) {
                console.log('✅ 关键词映射匹配，准备跳转');
                return;
            }

            console.log('📝 执行普通搜索逻辑');
            performNormalSearch(query);
        }

        // 生成固定的相关搜索
        function generateRelatedSearches() {
            // 为固定的相关搜索添加点击事件
            const relatedSearchLinks = document.querySelectorAll('.related-search');
            relatedSearchLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    const keyword = this.getAttribute('data-keyword');
                    document.getElementById('searchInput').value = keyword;
                    performSearch(keyword);
                });
            });
        }

        // 模拟搜索结果数据
        const searchResults = {
            "周哲叙电脑怎么连接？": [
                {
                    title: "暂无搜索结果！",
                    source: "请尝试其他关键词",
                    date: "2025-9-7",
                    url: "./system-responsezzx.html"
                }
            ],
            "周哲叙电脑怎么连接？": [
                {
                    title: "暂无搜索结果！",
                    source: "请尝试其他关键词",
                    date: "2025-9-7",
                    url: "./system-responsezzx.html"
                }
            ]
        };

        // 获取DOM元素
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsList = document.getElementById('resultsList');
        const pageTitle = document.getElementById('pageTitle');

        // 初始化搜索功能
        async function initSearch() {
            console.log('🔧 初始化搜索功能...');

            await loadKeywordRedirects();
            performSearch('周哲叙电脑提示');
            generateRelatedSearches();

            searchButton.addEventListener('click', function () {
                const query = searchInput.value.trim();
                if (query) {
                    performSearch(query);
                } else {
                    alert('请输入搜索关键词');
                }
            });

            searchInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    const query = searchInput.value.trim();
                    if (query) {
                        performSearch(query);
                    }
                }
            });

            console.log('✅ 搜索功能初始化完成');
        }

        document.addEventListener('DOMContentLoaded', initSearch);
    </script>
</body>
</html>
